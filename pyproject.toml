[project]
name = "cc-cost"
version = "0.1.0"
description = "Claude Code のセッションログから使用コストを算出するCLIツール"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cc-cost = "cc_cost.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_cost"]
